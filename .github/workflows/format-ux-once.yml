name: Format UX once

on:
  push:
    branches:
      - feat/ux-1-simplified-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-1-simplified-dashboard
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format UX files
        run: pnpm exec prettier --write src/app/page.tsx src/styles/vibrant-ui.css src/styles/ux-polish.css src/app/panel/page.tsx src/components/navigation/workspace-navigation.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/styles/vibrant-ui.css src/styles/ux-polish.css src/app/panel/page.tsx src/components/navigation/workspace-navigation.tsx
          git commit -m "chore: format UX files"
          git push origin HEAD:feat/ux-1-simplified-dashboard
