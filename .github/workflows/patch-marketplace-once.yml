name: Patch marketplace once

on:
  push:
    branches:
      - feat/marketplace-multi-channel

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message != 'fix: finalize marketplace hub typing'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-multi-channel
      - name: Fix marketplace hub typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/panel/entegrasyonlar/[channel]/page.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('connection?.credentialsConfigured', 'Boolean(connection?.credentialCiphertext)')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/panel/entegrasyonlar/[channel]/page.tsx'
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: finalize marketplace hub typing"
            git push origin HEAD:feat/marketplace-multi-channel
          fi
