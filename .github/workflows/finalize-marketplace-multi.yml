name: Finalize marketplace multi-channel

on:
  push:
    branches:
      - feat/marketplace-multi-channel

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-multi-channel
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Prisma enum and Amazon refresh token persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('prisma/schema.prisma')
          text = schema.read_text(encoding='utf-8')
          old = '''enum MarketplaceChannel {
            TRENDYOL
            HEPSIBURADA
            AMAZON_TR
          }'''
          new = '''enum MarketplaceChannel {
            TRENDYOL
            HEPSIBURADA
            AMAZON_TR
            N11
            PAZARAMA
            PTTAVM
            CICEKSEPETI
            IDEFIX
          }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif '    N11\n' not in text and '  N11\n' not in text:
              raise SystemExit('MarketplaceChannel enum block not found')
          schema.write_text(text, encoding='utf-8')

          service = Path('src/modules/marketplace/application/connection-service.ts')
          text = service.read_text(encoding='utf-8')
          old_field = '  webhookApiKey?: string | undefined;\n};'
          new_field = '  webhookApiKey?: string | undefined;\n  refreshToken?: string | undefined;\n};'
          if 'refreshToken?: string | undefined;' not in text:
              if old_field not in text:
                  raise SystemExit('credential patch field insertion point not found')
              text = text.replace(old_field, new_field, 1)
          old_next = '    webhookApiKey: input.webhookApiKey ?? existing?.webhookApiKey,\n  };'
          new_next = '    webhookApiKey: input.webhookApiKey ?? existing?.webhookApiKey,\n    refreshToken: input.refreshToken ?? existing?.refreshToken,\n  };'
          if 'refreshToken: input.refreshToken ?? existing?.refreshToken' not in text:
              if old_next not in text:
                  raise SystemExit('credential normalization insertion point not found')
              text = text.replace(old_next, new_next, 1)
          service.write_text(text, encoding='utf-8')
          PY
      - run: pnpm exec prisma format --schema prisma/schema.prisma
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/app/layout.tsx
          src/app/panel/entegrasyonlar/page.tsx
          'src/app/panel/entegrasyonlar/[channel]/page.tsx'
          src/app/panel/entegrasyonlar/trendyol/page.tsx
          'src/app/api/v1/marketplace/[channel]/export/route.ts'
          src/components/marketplace/marketplace-actions.tsx
          src/components/marketplace/marketplace-connection-form.tsx
          src/modules/marketplace/domain/types.ts
          src/modules/marketplace/domain/providers.ts
          src/modules/marketplace/application/schemas.ts
          src/modules/marketplace/application/connection-service.ts
          src/modules/marketplace/application/channel-preview.ts
          src/modules/marketplace/application/publish-service.ts
          src/modules/marketplace/adapters/registry.ts
          src/modules/marketplace/adapters/multi-channel-adapter.ts
          src/modules/marketplace/adapters/pttavm-adapter.ts
          src/modules/marketplace/adapters/idefix-adapter.ts
          src/styles/marketplace-hub.css
      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma src prisma/migrations/20260827210000_marketplace_multi_channel/migration.sql
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "chore: finalize marketplace multi-channel"
            git push origin HEAD:feat/marketplace-multi-channel
          fi
