name: Format competitive moat once

on:
  push:
    branches:
      - feat/competitive-moat-radar

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: format competitive moat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competitive-moat-radar
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/modules/intelligence/opportunity-score.ts
          src/modules/intelligence/opportunity-service.ts
          src/modules/intelligence/supplier-trust.ts
          src/modules/intelligence/supplier-trust-service.ts
          src/components/catalog/profit-calculator.tsx
          src/components/navigation/navigation-model.ts
          src/components/navigation/workspace-navigation.tsx
          src/app/panel/firsatlar/page.tsx
          src/app/urunler/page.tsx
          'src/app/urunler/[slug]/page.tsx'
          src/app/layout.tsx
          src/modules/catalog/application/public-catalog.ts
          src/styles/competitive-moat.css
          src/styles/supplier-trust.css
          tests/unit/navigation-model.test.ts
          tests/unit/opportunity-score.test.ts
          tests/unit/supplier-trust.test.ts
          docs/COMPETITOR_ANALYSIS_2026.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs/COMPETITOR_ANALYSIS_2026.md
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "chore: format competitive moat"
            git push origin HEAD:feat/competitive-moat-radar
          fi
