name: Format UX2

on:
  push:
    branches:
      - feat/ux-2-premium-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-2-premium-polish
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/app/layout.tsx src/app/page.tsx src/app/robots.ts src/app/sitemap.ts src/app/urunler/page.tsx src/modules/catalog/application/public-catalog.ts src/styles/ux-premium.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/layout.tsx src/app/page.tsx src/app/robots.ts src/app/sitemap.ts src/app/urunler/page.tsx src/modules/catalog/application/public-catalog.ts src/styles/ux-premium.css
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "chore: format UX2"
            git push origin HEAD:feat/ux-2-premium-polish
          fi