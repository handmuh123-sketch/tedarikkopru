name: Format luxury once

on:
  push:
    branches:
      - feat/marketplace-multi-channel

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketplace-multi-channel
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/styles/showcase-luxury.css
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/showcase-luxury.css
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
          else
            git commit -m "chore: format luxury showcase"
            git push origin HEAD:feat/marketplace-multi-channel
          fi
